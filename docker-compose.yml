version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: les05-api-jpa-mysql-swagger-security_mysql_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: learn_spring_api_jwt_swag_b01
      MYSQL_USER: user01
      MYSQL_PASSWORD: 12345678
    ports:
      - "3124:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
