version: '3.8'
services:
  keycloak-mysql:
    container_name: keycloak-mysql
    image: mysql
    volumes:
      - ./volume-data/mysql_keycloak_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: prac-spring3-mc-ecom-2025-b01-keycloak
      MYSQL_USER: phucdn
      MYSQL_PASSWORD: 12345678
    ports:
      - "3315:3306"

  keycloak:
    container_name: keycloak
    image: keycloak/keycloak:24.0.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: mysql
      KC_DB_URL_HOST: keycloak-mysql   # must match mysql service name
      KC_DB_URL_DATABASE: prac-spring3-mc-ecom-2025-b01-keycloak
      KC_DB_USERNAME: phucdn
      KC_DB_PASSWORD: 12345678
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
       - "8181:8080"
    volumes:
      - ./docker/keycloak/realms/:/opt/keycloak/data/import
    depends_on:
      - keycloak-mysql
